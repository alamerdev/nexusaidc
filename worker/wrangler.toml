name = "nexus-ai-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"
workers_dev = true

[[env.production]]
name = "nexus-ai-worker-prod"
route = "https://nexus-ai.your-domain.com/*"

[env.production.vars]
DISCORD_CLIENT_ID = "your_client_id"
DISCORD_CLIENT_SECRET = "your_client_secret"
DISCORD_BOT_TOKEN = "your_bot_token"
